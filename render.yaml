services:
  - type: web
    name: forgesight
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FORGESIGHT_SECRET_KEY
        generateValue: true
      - key: FORGESIGHT_SECURE_COOKIE
        value: "1"
